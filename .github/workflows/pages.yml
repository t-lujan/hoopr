# Publish site/ to GitHub Pages on every push to main and after each learning-loop run.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Record, grade and learn"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and the latest queued. Do not cancel in-progress
# production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload in its own job so deploy-pages looks up the artifact after it is
  # fully visible. Uploading and deploying in one job can lose the race
  # (Found 0 artifact(s) for github-pages).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
